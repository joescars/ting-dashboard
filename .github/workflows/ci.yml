name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Byte-compile everything
        run: python -m compileall -q app tests

  lint-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: for f in static/*.js; do node --check "$f"; done

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ting-dashboard:ci
          build-args: TING_VERSION=ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the image (demo mode)
        run: |
          docker run -d --name smoke -e TING_DEMO=1 -e TING_DATA_DIR=/data \
            --tmpfs /data:mode=1777 -p 8097:8097 ting-dashboard:ci
          for i in $(seq 1 30); do
            if curl -fsS localhost:8097/healthz; then ok=1; break; fi
            sleep 1
          done
          test "${ok:-0}" = 1
          curl -fsS localhost:8097/ | grep -qi "ting"
          curl -fsS -o /dev/null -w '%{http_code}' localhost:8097/manifest.webmanifest | grep -q 200
          docker rm -f smoke
